<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>News Archive · GameWire</title>
<style>
:root{
  --bg:#0a0e17;
  --bg-card:#111726;
  --border:#1e2636;
  --pink:#ff2e63;
  --cyan:#3ec6ff;
  --purple:#9d6bff;
  --orange:#ffb020;
  --text:#e8ecf3;
  --text-dim:#8b96ab;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.6;padding-bottom:60px;}
header.top{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--border);background:#0a0e17;position:sticky;top:0;z-index:10;}
.logo{font-weight:800;font-size:20px;letter-spacing:0.5px;}
.logo span{color:var(--pink);}
.back-link{display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);text-decoration:none;font-size:13px;padding:6px 12px;border:1px solid var(--border);border-radius:20px;transition:.2s;}
.back-link:hover{border-color:var(--cyan);color:var(--cyan);}
.wrap{max-width:760px;margin:0 auto;padding:0 20px;}

.intro{padding-top:28px;}
.intro h1{font-size:26px;font-weight:800;margin-bottom:8px;}
.intro p{color:var(--text-dim);font-size:14px;max-width:56ch;}

.search-box{
  margin-top:24px;
  display:flex;
  align-items:center;
  gap:10px;
  background:var(--bg-card);
  border:1px solid var(--border);
  border-radius:10px;
  padding:12px 16px;
}
.search-box:focus-within{border-color:var(--cyan);}
.search-box svg{flex:0 0 auto;color:var(--text-dim);}
.search-box input{
  flex:1; background:none; border:none; outline:none;
  color:var(--text); font-size:15px; font-family:inherit;
}
.search-box input::placeholder{color:var(--text-dim);}

.results{margin-top:24px;}
.result-count{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;display:none;}

.rel-card{display:block;text-decoration:none;color:inherit;background:var(--bg-card);border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:6px;padding:14px 16px;margin-bottom:10px;transition:.2s;}
.rel-card:hover{border-color:var(--accent);transform:translateX(2px);}
.rel-cat{font-size:11px;font-weight:700;letter-spacing:.5px;color:var(--accent);text-transform:uppercase;}
.rel-title{font-size:15px;font-weight:600;margin-top:4px;}
.rel-time{font-size:12px;color:var(--text-dim);margin-top:4px;}

.empty-state{
  text-align:center; padding:50px 20px; color:var(--text-dim); font-size:14px;
}

footer.site{max-width:760px;margin:40px auto 0;padding:20px;color:var(--text-dim);font-size:12px;display:flex;justify-content:space-between;border-top:1px solid var(--border);}
.sitenav{display:flex;gap:4px;overflow-x:auto;padding:10px 20px;border-bottom:1px solid var(--border);background:#0a0e17;}
.sitenav a{flex:0 0 auto;font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text-dim);text-decoration:none;padding:6px 12px;border-radius:4px;border:1px solid transparent;transition:.15s;}
.sitenav a:hover{color:var(--text);border-color:var(--border);}
.sitenav a.active{color:var(--pink);border-color:var(--pink);background:rgba(255,46,99,.08);}
</style>
</head>
<body>
<header class="top">
  <div class="logo">GAME<span>WIRE</span></div>
  <a class="back-link" href="index.html">← Back to Home</a>
</header>
<nav class="sitenav">
  <a href="index.html">Home</a>
  <a href="gaming.html">Gaming</a>
  <a href="tech.html">Tech &amp; Hacking</a>
  <a href="archive.html" class="active">Archive</a>
</nav>


<div class="wrap">
  <div class="intro">
    <h1>News Archive</h1>
    <p>Every story ever published — browse below, or search by name.</p>
  </div>

  <div class="search-box">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
    <input type="text" id="searchInput" placeholder="Search by title, e.g. &quot;Xbox&quot; or &quot;Valorant&quot; — or just scroll" autocomplete="off">
  </div>

  <div class="results">
    <div class="result-count" id="resultCount"></div>
    <div id="resultsList"></div>
    <div class="empty-state" id="emptyState">Start typing above to search the full news archive.</div>
  </div>
</div>

<footer class="site">
  <span>GAME WIRE © 2026</span>
  <span id="footerDate"></span>
</footer>

<script src="news-data.js"></script>
<script>
let allNews = typeof NEWS_ALL !== 'undefined' ? NEWS_ALL : [];

async function initArchive() {
  try {
    const res = await fetch('data/news.json', { cache: 'no-store' });
    if (res.ok) {
      const data = await res.json();
      if (data && Array.isArray(data.items)) {
        allNews = data.items.map(item => ({
          category: item.categoryBn || item.category,
          title: item.title,
          body: item.summary,
          time: item.pubDate ? new Date(item.pubDate).toLocaleDateString() : 'recent',
          color: 'var(--cyan)',
          link: '#'
        }));
      }
    }
  } catch (e) {
    console.log('Using local fallback');
  }
  render('');
}

const input = document.getElementById('searchInput');
const list = document.getElementById('resultsList');
const emptyState = document.getElementById('emptyState');
const resultCount = document.getElementById('resultCount');

document.getElementById('footerDate').textContent =
  new Date().toLocaleDateString('en-GB');

function colorVarToHex(colorVar){
  return colorVar || 'var(--cyan)';
}

function render(query){
  list.innerHTML = '';
  const q = query.trim().toLowerCase();

  const matches = q === ''
    ? allNews
    : allNews.filter(n => n.title.toLowerCase().includes(q) || (n.body && n.body.toLowerCase().includes(q)));

  if (matches.length === 0){
    emptyState.style.display = 'block';
    emptyState.textContent = `No news found for "${query}".`;
    resultCount.style.display = 'none';
    return;
  }

  emptyState.style.display = 'none';
  resultCount.style.display = 'block';
  resultCount.textContent = q === ''
    ? `${matches.length} total articles`
    : `${matches.length} result${matches.length > 1 ? 's' : ''}`;

  matches.forEach(n => {
    const a = document.createElement('a');
    a.className = 'rel-card';
    a.href = n.link || '#';
    a.style.setProperty('--accent', colorVarToHex(n.color));
    a.innerHTML = `
      <div class="rel-cat">${n.category}</div>
      <div class="rel-title">${n.title}</div>
      <div class="rel-time">${n.time}</div>
    `;
    list.appendChild(a);
  });
}

input.addEventListener('input', () => render(input.value));
initArchive();
</script>
</body>
</html>
